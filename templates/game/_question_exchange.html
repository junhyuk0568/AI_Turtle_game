{% load game_extras %}<div class="message-row user">
    <div class="message-stack">
        <span class="message-meta">나</span>
        <div class="message-bubble user">{{ log.question_text }}</div>
    </div>
    <img class="user-avatar" src="/static/game/img/user-avatar.webp" alt="나">
</div>

<div class="message-row host answer-row">
    <img class="host-avatar" src="/static/game/img/admin-avatar.webp" alt="진행자">
    <div class="message-stack">
        <span class="message-meta">진행자 · {{ log.created_at|date:"H:i" }}</span>
        <div class="message-bubble host judgement {{ log.answer_label|reply_class }}">{{ log.answer_label|host_reply }}</div>
        <form class="report-form" method="post" action="{% url 'game:report_judgement' game_session.id log.id %}">
            {% csrf_token %}
            <button class="report-button" type="submit" {% if log.reported_at %}disabled{% endif %}>
                {% if log.reported_at %}신고 접수됨{% else %}판정이 이상해요{% endif %}
            </button>
        </form>
    </div>
</div>
